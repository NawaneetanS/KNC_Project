name: knc_signature
channels:
  - rapidsai
  - nvidia
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # R & Bioconductor Packages (for 01_load_clean_data.R through 05_deg_analysis.R)
  - r-base>=4.3
  - r-tidyverse
  - r-dplyr
  - r-janitor
  - r-data.table
  - r-tidyr
  - r-purrr
  - r-ggplot2
  - r-patchwork
  - r-scales
  - r-ggpubr
  - r-stringr
  - r-survival
  - r-survminer
  - r-pheatmap
  - r-car
  - bioconductor-maftools
  - bioconductor-edger
  - bioconductor-annotationdbi
  - bioconductor-enhancedvolcano
  - bioconductor-biomart
  - bioconductor-limma
  - bioconductor-deseq2
  - bioconductor-org.hs.eg.db

  # Python, RAPIDS & Spatial Analysis Packages (for 06_spatial_analysis.ipynb)
  - python=3.11
  - rapids=26.04
  - cuda-version=13.1
  - cudnn
  - cutensor
  - cusparselt
  - scanpy
  - squidpy
  - anndata
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - scikit-image
  - numba
  - h5py
  - zarr
  - dask
  - ipykernel
  - jupyterlab
  - pip
  - pip:
      - gdown
      - wget
      - scikit-misc
      - rapids-singlecell
